name: Nightly retrain

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC every day
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train chat brain
        run: python -m myai.train_chat --seed --steps 1500

      - name: Train shape brain
        run: python -m myai.train_shapes --steps 1200

      - name: Commit updated weights
        run: |
          git config user.name "my-ai-trainer"
          git config user.email "my-ai-trainer@users.noreply.github.com"
          # Force-add because weights/*.pt and weights/*.json are gitignored
          # (so local testing doesn't pollute commits) but the trained
          # weights from this CI run ARE what we want to persist.
          git add -f weights/chat_brain.pt weights/shape_brain.pt weights/tokenizer.json 2>/dev/null || true
          git add data/shape_examples/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "nightly retrain $(date -u +%Y-%m-%d)"
            git push
          fi
